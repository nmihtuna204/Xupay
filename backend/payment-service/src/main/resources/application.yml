spring:
  application:
    name: payment-service
  
  datasource:
    # Defaults target local dev (docker infra on 5433); Docker overrides via
    # SPRING_DATASOURCE_* env vars in docker-compose.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/payment_db}
    username: ${SPRING_DATASOURCE_USERNAME:payment_service_user}
    password: ${SPRING_DATASOURCE_PASSWORD:P@ym3ntS3rv1c3P@ss2025!}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        format_sql: true
    show-sql: false
  
  flyway:
    enabled: true  # Enable Flyway migrations (V1 already applied, V2 will run on next start)
    baseline-on-migrate: true  # Allow Flyway to work with existing schema
    locations: classpath:db/migration  # V1__complete_payment_schema.sql, V2__fraud_rules_data.sql
  
  # Redis: idempotency cache and the signed-out token check, both best effort
  # (see RedisConfig). A short timeout keeps a stalled Redis from stalling
  # every request; Docker passes the same 2000 ms.
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:R3d1sP@ss2025!}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2000}
      connect-timeout: 2000
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: 8082

# JWT verification. Must match user-service's jwt.secret / jwt.issuer exactly:
# user-service signs the tokens, this service only verifies them. The default
# is user-service's own local default; Docker passes the shared JWT_SECRET.
jwt:
  secret: ${JWT_SECRET:xupay-super-secret-key-minimum-256-bits-for-production-use-only}
  issuer: xupay-user-service

# Shared secret this service presents on every gRPC call to user-service (see
# ServiceTokenClientInterceptor). Must equal user-service's
# xupay.grpc.service-token; Docker passes GRPC_SERVICE_TOKEN to both.
xupay:
  grpc:
    service-token: ${GRPC_SERVICE_TOKEN:xupay-local-dev-grpc-service-token-change-me}

# gRPC Client Configuration (for calling User Service)
# Local default: user-service gRPC on 50053. Docker overrides via
# GRPC_CLIENT_USER_SERVICE_ADDRESS (static://user-service:9091).
grpc:
  client:
    user-service:
      address: ${GRPC_CLIENT_USER_SERVICE_ADDRESS:static://localhost:50053}
      negotiationType: ${GRPC_CLIENT_USER_SERVICE_NEGOTIATION_TYPE:plaintext}

# Actuator: health only, without details. /actuator/** is outside the bearer
# token check (the Docker healthcheck calls it), and with metrics exposed and
# health details on, anyone could read request counts and URIs, JVM internals,
# and which databases, cache and gRPC channel this service depends on.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Logging
logging:
  level:
    com.xupay.payment: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
