spring:
  application:
    name: user-service
    version: 1.0.0

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:user_db}
    username: ${DB_USER:user_service_user}
    password: ${DB_PASSWORD:UserS3rv1c3P@ss2025!}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true

  # V1 is applied by the postgres container's initdb scripts, so an existing
  # database is baselined at 1 and V2+ run on top of it (same as payment-service).
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: update  # Development: update schema automatically
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
          fetch_size: 50
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # Redis holds revoked tokens (logout) and failed sign-in counters. Both are
  # best effort: if Redis is down, requests are let through and the failure
  # is logged. The short timeout keeps an outage from stalling every request.
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:R3d1sP@ss2025!}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2000}
      connect-timeout: 2000
      repositories:
        enabled: false  # plain key/value use; the repositories here are JPA

# Health must not turn DOWN when Redis is unreachable: the service keeps
# serving without it (see above), and a DOWN health would fail the Docker
# healthcheck.
management:
  health:
    redis:
      enabled: false

server:
  port: 8081
  servlet:
    context-path: /
  compression:
    enabled: true
    min-response-size: 1024

grpc:
  server:
    port: 50053
    enable-keep-alive: true
    enable-keep-alive-without-calls: true
    keep-alive-time: 30m
    keep-alive-timeout: 10s
    max-inbound-message-size: 4194304  # 4MB
    security:
      enabled: false  # Disable Spring Security for gRPC (we use custom JWT interceptor)

# JWT Configuration
# KYC reviewer bootstrap (see AdminBootstrap). Unset = no admin is created.
xupay:
  admin:
    email: ${XUPAY_ADMIN_EMAIL:}
    password: ${XUPAY_ADMIN_PASSWORD:}
  # Shared secret the Payment Service presents on every gRPC call (see
  # ServiceTokenGrpcInterceptor). Same local default as payment-service;
  # Docker passes GRPC_SERVICE_TOKEN to both.
  grpc:
    service-token: ${GRPC_SERVICE_TOKEN:xupay-local-dev-grpc-service-token-change-me}
  # The sign-in cookie (see AuthCookies). Secure = sent over HTTPS only: set
  # AUTH_COOKIE_SECURE=true wherever the app is served over HTTPS. Off by
  # default because local development runs on plain http://localhost.
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:false}

jwt:
  secret: ${JWT_SECRET:xupay-super-secret-key-minimum-256-bits-for-production-use-only}
  expiration: 86400000  # 24 hours in milliseconds
  issuer: xupay-user-service
  audience: xupay-client

logging:
  level:
    root: INFO
    com.fintech: DEBUG
    net.devh.boot.grpc: TRACE
    org.springframework.web: INFO
    org.hibernate: WARN
    io.grpc: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"