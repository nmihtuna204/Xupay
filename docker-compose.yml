# ========================================================
# XuPay - E-Wallet Microservices Platform
# ========================================================
# Services:       User Service (8081), Payment Service (8082),
#                 Frontend (3000)
# Infrastructure: PostgreSQL x2, Redis
#
# Quick start:    docker compose up -d --build
# Logs:           docker compose logs -f [service]
# Stop:           docker compose down          (keep data)
# Reset:          docker compose down -v       (wipe data)
#
# Secrets: override defaults by creating a .env file
# (see .env.example). Defaults are for local development only.
#
# Every published port is bound to 127.0.0.1: the default passwords and JWT
# secret are public in this repository, so a port reachable from the network
# (Docker Desktop's firewall rule allows it even on Public Wi-Fi) would let
# anyone nearby log into the databases or sign their own tokens. The app is
# used from this machine (the frontend calls the APIs at localhost). To expose
# a port on purpose, drop the "127.0.0.1:" - after replacing every default
# secret in .env.
# ========================================================

networks:
  xupay-network:
    driver: bridge

volumes:
  postgres-user-data:
  postgres-payment-data:
  redis-data:

services:

  # ------------------------------------------------------
  # DATABASE: USER SERVICE
  # ------------------------------------------------------
  postgres-user:
    image: postgres:15-alpine
    container_name: xupay-postgres-user
    restart: unless-stopped
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: user_service_user
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-UserS3rv1c3P@ss2025!}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
      - ./infrastructure/db/user-service:/docker-entrypoint-initdb.d:ro
    networks:
      - xupay-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_service_user -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------
  # DATABASE: PAYMENT SERVICE
  # ------------------------------------------------------
  postgres-payment:
    image: postgres:15-alpine
    container_name: xupay-postgres-payment
    restart: unless-stopped
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: payment_service_user
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:-P@ym3ntS3rv1c3P@ss2025!}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5433:5432"  # External 5433 to avoid conflict with postgres-user
    volumes:
      - postgres-payment-data:/var/lib/postgresql/data
      - ./infrastructure/db/payment-service:/docker-entrypoint-initdb.d:ro
    networks:
      - xupay-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_service_user -d payment_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------
  # REDIS (idempotency cache, signed-out tokens, failed sign-in counters)
  # ------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: xupay-redis
    restart: unless-stopped
    environment:
      # Exposed to the container so the healthcheck can authenticate
      REDIS_PASSWORD: ${REDIS_PASSWORD:-R3d1sP@ss2025!}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - xupay-network
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "${REDIS_PASSWORD:-R3d1sP@ss2025!}"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------
  # USER SERVICE (Spring Boot, REST 8081 + gRPC 9091)
  # ------------------------------------------------------
  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: xupay-user-service
    restart: unless-stopped
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/user_db
      SPRING_DATASOURCE_USERNAME: user_service_user
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD:-UserS3rv1c3P@ss2025!}

      # JPA/Hibernate + Flyway
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"

      # Server
      SERVER_PORT: 8081
      SPRING_APPLICATION_NAME: user-service

      # JWT
      JWT_SECRET: ${JWT_SECRET:-YourSuperSecretJWTKeyForProductionUseAtLeast256BitsChangeThis2025!}
      JWT_EXPIRATION: 86400000  # 24 hours

      # The sign-in cookie (HttpOnly, SameSite=Strict) carries the token for
      # the web app. Set AUTH_COOKIE_SECURE=true when serving over HTTPS.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}

      # Redis: signed-out tokens (read by payment-service too) and failed
      # sign-in counters. Best effort: if Redis is down, requests go through.
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-R3d1sP@ss2025!}
      SPRING_DATA_REDIS_TIMEOUT: 2000

      # KYC reviewer, created (or promoted) at startup - see AdminBootstrap.
      # Local-dev default only; set ADMIN_EMAIL / ADMIN_PASSWORD in .env.
      XUPAY_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@xupay.local}
      XUPAY_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}

      # gRPC Server. Only payment-service may call it: it must present this
      # shared token (see ServiceTokenGrpcInterceptor).
      GRPC_SERVER_PORT: 9091
      GRPC_SERVICE_TOKEN: ${GRPC_SERVICE_TOKEN:-LocalDevGrpcServiceTokenChangeThisInDotEnv2025!}

      # Logging
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_XUPAY: INFO
    # gRPC (9091) is deliberately not published: only payment-service, on
    # this network, calls it. Add "9091:9091" here only to debug from the host.
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres-user:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xupay-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ------------------------------------------------------
  # PAYMENT SERVICE (Spring Boot, REST 8082)
  # ------------------------------------------------------
  payment-service:
    build:
      context: ./backend/payment-service
      dockerfile: Dockerfile
    container_name: xupay-payment-service
    restart: unless-stopped
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-payment:5432/payment_db
      SPRING_DATASOURCE_USERNAME: payment_service_user
      SPRING_DATASOURCE_PASSWORD: ${PAYMENT_DB_PASSWORD:-P@ym3ntS3rv1c3P@ss2025!}

      # JPA/Hibernate + Flyway
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"

      # Server
      SERVER_PORT: 8082
      SPRING_APPLICATION_NAME: payment-service

      # Redis (Spring Boot 3 keys: spring.data.redis.*)
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-R3d1sP@ss2025!}
      SPRING_DATA_REDIS_TIMEOUT: 2000

      # JWT - the same secret user-service signs with; payment-service
      # verifies every request's token with it.
      JWT_SECRET: ${JWT_SECRET:-YourSuperSecretJWTKeyForProductionUseAtLeast256BitsChangeThis2025!}

      # gRPC Client -> User Service, authenticated with the shared service token
      GRPC_CLIENT_USER_SERVICE_ADDRESS: static://user-service:9091
      GRPC_CLIENT_USER_SERVICE_NEGOTIATION_TYPE: plaintext
      GRPC_SERVICE_TOKEN: ${GRPC_SERVICE_TOKEN:-LocalDevGrpcServiceTokenChangeThisInDotEnv2025!}

      # Logging
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_XUPAY: INFO
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      postgres-payment:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks:
      - xupay-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ------------------------------------------------------
  # FRONTEND (Next.js 16)
  # ------------------------------------------------------
  frontend:
    build:
      context: ./frontend/xupay-frontend
      dockerfile: Dockerfile
      args:
        # URLs the BROWSER uses to reach the APIs (host-mapped ports)
        NEXT_PUBLIC_USER_SERVICE_URL: ${NEXT_PUBLIC_USER_SERVICE_URL:-http://localhost:8081}
        NEXT_PUBLIC_PAYMENT_SERVICE_URL: ${NEXT_PUBLIC_PAYMENT_SERVICE_URL:-http://localhost:8082}
    container_name: xupay-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      user-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    networks:
      - xupay-network
